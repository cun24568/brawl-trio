<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ブロスタ トリオデータベース | マップ別ティア・推奨編成</title>
  <meta name="description" content="ブロスタ トリオサバイバル(トリオバトロワ)専門のメタ集計サイト。6カ国TOP200プレイヤーの実戦データから、マップ別ティア表・ブロウラー採用率・3人組推奨編成をリアルタイム公開。1時間ごと自動更新。">
  <link rel="canonical" href="https://brawl-trio.vercel.app/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://brawl-trio.vercel.app/">
  <meta property="og:title" content="ブロスタ トリオデータベース | マップ別ティア・推奨編成">
  <meta property="og:description" content="トリオサバイバル特化のメタ集計。6カ国TOP200の実戦データからマップ別ティア表・推奨3人組編成を公開、1時間ごと自動更新。">
  <meta property="og:site_name" content="ブロスタ トリオデータベース">
  <meta property="og:locale" content="ja_JP">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ブロスタ トリオデータベース">
  <meta name="twitter:description" content="トリオサバイバル特化のメタ集計サイト。マップ別ティア・推奨3人組編成を実戦データから公開。">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ブロスタ トリオデータベース",
    "alternateName": "brawl-trio",
    "url": "https://brawl-trio.vercel.app/",
    "inLanguage": "ja",
    "description": "ブロスタ トリオサバイバル(トリオバトロワ)専門のメタ集計サイト。6カ国TOP200の実戦データからマップ別ティア・推奨編成を公開。"
  }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-2xl font-bold">ブロスタ トリオデータベース</h1>
      <div id="meta-info" class="text-sm text-gray-400 mt-1">読込中...</div>
      <div id="rotation-banner" class="mt-2"></div>
    </div>
  </header>

  <nav class="bg-gray-800 border-b border-gray-700 px-4">
    <div class="max-w-7xl mx-auto flex gap-2 pb-2 overflow-x-auto">
      <button class="tab-btn px-4 py-2 rounded font-semibold bg-blue-600 whitespace-nowrap" data-tab="maps">マップ別ティア</button>
      <button class="tab-btn px-4 py-2 rounded font-semibold bg-gray-700 whitespace-nowrap" data-tab="brawlers">ブロウラー別</button>
      <button class="tab-btn px-4 py-2 rounded font-semibold bg-gray-700 whitespace-nowrap" data-tab="mypage">マイページ</button>
      <button class="tab-btn px-4 py-2 rounded font-semibold bg-gray-700 whitespace-nowrap" data-tab="club">クラブ</button>
      <button class="tab-btn px-4 py-2 rounded font-semibold bg-gray-700 whitespace-nowrap" data-tab="ranking">ランキング</button>
      <button class="tab-btn px-4 py-2 rounded font-semibold bg-gray-700 whitespace-nowrap" data-tab="roulette">ルーレット</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4">
    <div id="tab-maps" class="tab-content">
      <div class="mb-4">
        <label class="text-sm text-gray-400 block mb-1">マップ選択</label>
        <select id="map-select" class="w-full p-2 bg-gray-800 border border-gray-700 rounded focus:outline-none focus:border-blue-500 text-base"></select>
      </div>
      <div id="map-detail"></div>
    </div>

    <div id="tab-brawlers" class="tab-content hidden">
      <div class="flex flex-wrap gap-2 mb-3 items-center">
        <input type="text" id="brawler-search" placeholder="ブロウラー名で検索"
          class="flex-1 min-w-[160px] p-2 bg-gray-800 border border-gray-700 rounded focus:outline-none focus:border-blue-500">
        <select id="brawler-sort" class="p-2 bg-gray-800 border border-gray-700 rounded text-sm">
          <option value="best_tier">最高ティア順</option>
          <option value="weighted_wr">勝率順</option>
          <option value="weighted_avg_rank">平均順位順</option>
          <option value="picks">ピック数順</option>
          <option value="name">名前順</option>
        </select>
        <label class="text-sm text-gray-300 flex items-center gap-1 px-2 py-2 bg-gray-800 border border-gray-700 rounded cursor-pointer hover:bg-gray-700">
          <input type="checkbox" id="brawler-filter-strong" class="cursor-pointer">
          <span>S+/Sのみ</span>
        </label>
      </div>
      <div id="brawler-count" class="text-xs text-gray-500 mb-2"></div>
      <div id="brawler-grid"></div>
      <div id="brawler-detail" class="mt-6"></div>
    </div>

    <div id="tab-mypage" class="tab-content hidden">
      <div class="bg-gray-800 p-4 rounded mb-4">
        <label class="text-sm text-gray-400 block mb-2">プレイヤータグ (例: #YQ8YY09R) または 名前 (例: 🍣)</label>
        <div class="flex gap-2 relative">
          <input type="text" id="mypage-tag" placeholder="#XXXXXXXX または プレイヤー名"
            class="flex-1 p-2 bg-gray-900 border border-gray-700 rounded font-mono focus:outline-none focus:border-blue-500" autocomplete="off">
          <button id="mypage-search" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded font-semibold whitespace-nowrap">
            検索
          </button>
          <button id="mypage-bookmark" class="px-3 py-2 bg-gray-700 hover:bg-yellow-600 rounded font-semibold whitespace-nowrap" title="ブックマーク追加/削除">
            ☆
          </button>
          <button id="mypage-refresh" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded font-semibold whitespace-nowrap hidden">
            更新
          </button>
          <div id="mypage-suggest" class="absolute top-full left-0 right-0 mt-1 bg-gray-800 border border-gray-700 rounded shadow-lg max-h-72 overflow-y-auto z-30 hidden"></div>
        </div>
        <div class="text-xs text-gray-500 mt-2">
          初回登録すると30分ごとに自動でバトルログが蓄積されます。<br>
          名前検索は過去のクロールで観測されたプレイヤーから部分一致。 ☆でブックマーク。
        </div>
      </div>
      <div id="mypage-bookmarks" class="mb-4"></div>
      <div id="mypage-detail"></div>
    </div>

    <div id="tab-club" class="tab-content hidden">
      <div class="bg-gray-800 p-4 rounded mb-4">
        <label class="text-sm text-gray-400 block mb-2">クラブタグ (例: #2QG9UVUUY) または 名前</label>
        <div class="flex gap-2 relative">
          <input type="text" id="club-tag" placeholder="#XXXXXXXX または クラブ名"
            class="flex-1 p-2 bg-gray-900 border border-gray-700 rounded font-mono focus:outline-none focus:border-blue-500" autocomplete="off">
          <button id="club-search" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded font-semibold whitespace-nowrap">
            検索
          </button>
          <div id="club-suggest" class="absolute top-full left-0 right-0 mt-1 bg-gray-800 border border-gray-700 rounded shadow-lg max-h-72 overflow-y-auto z-30 hidden"></div>
        </div>
        <div class="text-xs text-gray-500 mt-2">
          クラブメンバー全員のトリオ戦績を一覧表示。<br>
          名前検索は各国TOP200クラブのみ対象 (公式APIの制限)。
        </div>
      </div>
      <div id="club-detail"></div>
    </div>

    <div id="tab-ranking" class="tab-content hidden">
      <div class="bg-gray-800 p-4 rounded mb-4">
        <div class="flex flex-wrap gap-2">
          <div>
            <label class="text-xs text-gray-400 block mb-1">指標</label>
            <select id="ranking-order" class="p-2 bg-gray-900 border border-gray-700 rounded text-sm">
              <option value="rank1_rate">1位率</option>
              <option value="top2_rate">TOP2率</option>
              <option value="avg_rank">平均順位</option>
              <option value="battles">試合数</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-gray-400 block mb-1">最低試合数</label>
            <select id="ranking-min" class="p-2 bg-gray-900 border border-gray-700 rounded text-sm">
              <option value="10">10戦以上</option>
              <option value="30">30戦以上</option>
              <option value="50" selected>50戦以上</option>
              <option value="100">100戦以上</option>
              <option value="300">300戦以上</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-gray-400 block mb-1">期間</label>
            <select id="ranking-period" class="p-2 bg-gray-900 border border-gray-700 rounded text-sm">
              <option value="all">全期間</option>
              <option value="30d">直近30日</option>
              <option value="7d">直近7日</option>
              <option value="1d">直近1日</option>
            </select>
          </div>
          <div class="self-end">
            <button id="ranking-refresh" class="p-2 bg-blue-600 hover:bg-blue-500 rounded text-sm font-semibold">更新</button>
          </div>
        </div>
        <div class="text-xs text-gray-500 mt-2">
          マイページに登録された (= 一度でも検索された) プレイヤーの中からランキング。<br>
          行クリックでそのプレイヤーのマイページへ。
        </div>
      </div>
      <div id="ranking-result"></div>
    </div>

    <div id="tab-roulette" class="tab-content hidden">
      <div class="bg-gray-800 p-4 rounded mb-4">
        <div class="flex flex-wrap gap-2 mb-3">
          <div class="flex-1 min-w-[180px]">
            <label class="text-xs text-gray-400 block mb-1">マップ</label>
            <select id="roulette-map" class="w-full p-2 bg-gray-900 border border-gray-700 rounded text-base"></select>
          </div>
          <div class="flex-1 min-w-[140px]">
            <label class="text-xs text-gray-400 block mb-1">対象</label>
            <select id="roulette-tier" class="w-full p-2 bg-gray-900 border border-gray-700 rounded text-base">
              <option value="all">全ブロウラー</option>
              <option value="pool" selected>現プール掲載</option>
              <option value="A+">A以上</option>
              <option value="S+S">S/S+のみ</option>
              <option value="Sp">S+のみ</option>
            </select>
          </div>
        </div>
        <button id="roulette-spin" class="w-full py-3 bg-yellow-600 hover:bg-yellow-500 rounded font-bold text-lg">
          🎰 ルーレット回す
        </button>
      </div>
      <div id="roulette-result"></div>
    </div>

  </main>

  <button id="scroll-top-btn" class="fixed bottom-4 right-4 w-12 h-12 bg-blue-600 hover:bg-blue-500 rounded-full shadow-lg text-white text-xl flex items-center justify-center transition-opacity opacity-0 pointer-events-none z-20" aria-label="トップに戻る">↑</button>

  <footer class="text-center text-xs text-gray-500 p-4">
    Brawl Stars 公式API + Brawlify API データ / Fan Made
  </footer>

  <script src="/ui/app.js"></script>
</body>
</html>
