<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://brawl-trio.vercel.app/">

  <meta property="og:description" content="トリオサバイバル特化のメタ集計。6カ国TOP200の実戦データからマップ別ティア表・推奨3人組編成を公開、1時間ごと自動更新。">
  <meta property="og:site_name" content="ブロスタ トリオサバイバル メタDB">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ブロスタ トリオサバイバル メタDB">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ブロスタ トリオサバイバル メタDB",
    "alternateName": "brawl-trio",
    "url": "https://brawl-trio.vercel.app/",
    "inLanguage": "ja",
    "description": "ブロスタ トリオサバイバル(トリオバトロワ)専門のメタ集計サイト。6カ国TOP200の実戦データからマップ別ティア・推奨編成を公開。"
  }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-2xl font-bold">ブロスタ トリオサバイバル メタDB</h1>
      <div id="meta-info" class="text-sm text-gray-400 mt-1">読込中...</div>
    </div>
  </header>

  <nav class="bg-gray-800 border-b border-gray-700 px-4">
    <div class="max-w-7xl mx-auto flex gap-2 pb-2 overflow-x-auto">
      <button class="tab-btn px-4 py-2 rounded font-semibold bg-blue-600 whitespace-nowrap" data-tab="maps">マップ別ティア</button>
      <button class="tab-btn px-4 py-2 rounded font-semibold bg-gray-700 whitespace-nowrap" data-tab="brawlers">ブロウラー別</button>
      <button class="tab-btn px-4 py-2 rounded font-semibold bg-gray-700 whitespace-nowrap" data-tab="mypage">マイページ</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4">
    <div id="tab-maps" class="tab-content">
      <div class="mb-4">
        <label class="text-sm text-gray-400 block mb-1">マップ選択</label>
        <select id="map-select" class="w-full p-2 bg-gray-800 border border-gray-700 rounded focus:outline-none focus:border-blue-500 text-base"></select>
      </div>
      <div id="map-detail"></div>
    </div>

    <div id="tab-brawlers" class="tab-content hidden">
      <input type="text" id="brawler-search" placeholder="ブロウラー名で検索"
        class="w-full p-2 bg-gray-800 border border-gray-700 rounded mb-4 focus:outline-none focus:border-blue-500">
      <div id="brawler-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2"></div>
      <div id="brawler-detail" class="mt-6"></div>
    </div>

    <div id="tab-mypage" class="tab-content hidden">
      <div class="bg-gray-800 p-4 rounded mb-4">
        <label class="text-sm text-gray-400 block mb-2">プレイヤータグ (例: #YQ8YY09R)</label>
        <div class="flex gap-2">
          <input type="text" id="mypage-tag" placeholder="#XXXXXXXX"
            class="flex-1 p-2 bg-gray-900 border border-gray-700 rounded font-mono uppercase focus:outline-none focus:border-blue-500">
          <button id="mypage-search" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded font-semibold whitespace-nowrap">
            検索
          </button>
          <button id="mypage-refresh" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded font-semibold whitespace-nowrap hidden">
            更新
          </button>
        </div>
        <div class="text-xs text-gray-500 mt-2">
          初回登録すると30分ごとに自動でバトルログが蓄積されます。<br>
          公式APIの仕様で過去の試合は遡れません (登録時点〜未来分のみ)。<br>
          ウォッチリスト上限50タグ、満杯時は最古登録のタグから退役します。
        </div>
      </div>
      <div id="mypage-detail"></div>
    </div>
  </main>

  <footer class="text-center text-xs text-gray-500 p-4">
    Brawl Stars 公式API + Brawlify API データ / Fan Made
  </footer>

  <script src="/ui/app.js"></script>
</body>
</html>
